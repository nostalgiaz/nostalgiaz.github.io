<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#101018" />
		<title>Mattia Larentis — Senior Full Stack Developer &amp; Solution Architect</title>
		<style>
			:root {
				color-scheme: dark;
				--background: #101018;
				--foreground: #fff8ff;
				--muted: #b6aab9;
				--magenta: #ff35bd;
				--cyan: #36f5ed;
				--line: rgb(255 255 255 / 18%);
			}

			* { box-sizing: border-box; }

			body {
				--page-background: var(--background);
				--page-foreground: var(--foreground);
				--page-muted: var(--muted);
				--page-line: var(--line);
				isolation: isolate;
				min-height: 100vh;
				min-height: 100svh;
				margin: 0;
				overflow: hidden;
				background: var(--page-background);
				color: var(--page-foreground);
				font-family: Arial, Helvetica, sans-serif;
				transition: background-color 350ms ease, color 350ms ease;
			}

			body.lights-on {
				color-scheme: light;
				--page-background: #fff3fb;
				--page-foreground: #211323;
				--page-muted: #67566a;
				--page-line: rgb(33 19 35 / 18%);
			}

			body.lights-on .role { color: #006b70; }

			body::before,
			body::after {
				position: fixed;
				z-index: -1;
				inset: 0;
				content: "";
				pointer-events: none;
			}

			body::before {
				background:
					radial-gradient(ellipse 38rem 26rem at 50% 44%, rgb(255 53 189 / 7%), transparent 75%),
					radial-gradient(ellipse 34rem 22rem at 50% 52%, rgb(54 245 237 / 3%), transparent 78%);
			}

			body::after {
				background: radial-gradient(ellipse at center, transparent 35%, rgb(0 0 0 / 18%) 100%);
				transition: opacity 350ms ease;
			}

			body.lights-on::after { opacity: 0.12; }

			main {
				display: grid;
				min-height: 100vh;
				min-height: 100svh;
				place-items: center;
				padding: 5rem 1.25rem 2rem;
			}

			.identity {
				width: min(100%, 1100px);
				text-align: center;
			}

			.eyebrow {
				margin: 0 0 0.9rem;
				color: var(--page-muted);
				font-size: 0.72rem;
				font-weight: 800;
				letter-spacing: 0.22em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0;
				font-size: clamp(4rem, 17vw, 13rem);
				font-weight: 1000;
				letter-spacing: -0.09em;
				line-height: 0.78;
				text-transform: uppercase;
			}

			.name-line {
				position: relative;
				display: block;
				width: fit-content;
				margin-inline: auto;
				isolation: isolate;
			}

			.name-line::before,
			.name-line::after {
				position: absolute;
				inset: 0;
				z-index: -1;
				content: attr(data-text);
				pointer-events: none;
				white-space: nowrap;
			}

			.name-line::before {
				color: var(--cyan);
				animation: glitch-cyan 2.1s steps(1, end) infinite;
			}

			.name-line::after {
				color: var(--magenta);
				animation: glitch-magenta 2.4s steps(1, end) infinite;
			}

			@keyframes glitch-cyan {
				0%, 91%, 100% { clip-path: inset(0); transform: translate(-0.045em, -0.01em); }
				92% { clip-path: inset(12% 0 68%); transform: translate(-0.12em, 0.015em); }
				94% { clip-path: inset(56% 0 18%); transform: translate(0.025em, -0.02em); }
				96% { clip-path: inset(0); transform: translate(-0.045em, -0.01em); }
			}

			@keyframes glitch-magenta {
				0%, 93%, 100% { clip-path: inset(0); transform: translate(0.045em, 0.01em); }
				94% { clip-path: inset(35% 0 43%); transform: translate(0.13em, -0.015em); }
				96% { clip-path: inset(72% 0 8%); transform: translate(-0.02em, 0.02em); }
				98% { clip-path: inset(0); transform: translate(0.045em, 0.01em); }
			}

			.role {
				position: relative;
				width: fit-content;
				margin: 2rem auto 0;
				color: var(--cyan);
				font-size: clamp(0.58rem, 2vw, 1rem);
				font-weight: 800;
				letter-spacing: 0.02em;
				white-space: nowrap;
				text-transform: uppercase;
			}

			.role::before,
			.role::after {
				position: absolute;
				inset: 0;
				content: attr(data-text);
				pointer-events: none;
				white-space: nowrap;
			}

			.role::before {
				color: var(--magenta);
				animation: role-glitch-magenta 4.3s steps(1, end) infinite;
			}

			.role::after {
				color: var(--cyan);
				animation: role-glitch-cyan 3.7s steps(1, end) infinite;
			}

			@keyframes role-glitch-magenta {
				0%, 88%, 100% { clip-path: inset(0 0 100%); transform: translateX(0); }
				89% { clip-path: inset(20% 0 58%); transform: translateX(0.12em); }
				90% { clip-path: inset(64% 0 16%); transform: translateX(-0.08em); }
				91% { clip-path: inset(0 0 100%); transform: translateX(0); }
			}

			@keyframes role-glitch-cyan {
				0%, 92%, 100% { clip-path: inset(0 0 100%); transform: translateX(0); }
				93% { clip-path: inset(42% 0 38%); transform: translateX(-0.1em); }
				94% { clip-path: inset(8% 0 76%); transform: translateX(0.07em); }
				95% { clip-path: inset(0 0 100%); transform: translateX(0); }
			}

			.details {
				display: flex;
				justify-content: center;
				gap: 0.55rem 1.1rem;
				flex-wrap: wrap;
				margin: 1.3rem 0 2.4rem;
				color: var(--page-muted);
				font-size: 0.9rem;
			}

			.details a { color: inherit; text-decoration-color: var(--magenta); text-underline-offset: 3px; }

			.links {
				display: flex;
				justify-content: center;
				gap: clamp(1.1rem, 5vw, 3.5rem);
				flex-wrap: wrap;
			}

			.link-item {
				display: flex;
				align-items: center;
				flex-direction: column;
				gap: 0.25rem;
			}

			.link-prefix {
				color: var(--page-muted);
				font-size: 0.52rem;
				font-weight: 700;
				letter-spacing: 0.13em;
				text-transform: uppercase;
			}

			.links a {
				padding: 0.35rem 0;
				border-bottom: 1px solid var(--page-line);
				color: var(--page-muted);
				font-size: 0.78rem;
				font-weight: 800;
				letter-spacing: 0.13em;
				text-decoration: none;
				text-transform: uppercase;
				transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
			}

			.links a:hover, .links a:focus-visible {
				transform: translateY(-2px);
				border-color: var(--magenta);
				color: var(--page-foreground);
			}
			.links a:focus-visible, .details a:focus-visible, .cord:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

			.cord {
				position: fixed;
				z-index: 2;
				top: 0;
				right: clamp(1.5rem, 8vw, 7rem);
				display: flex;
				width: 3.5rem;
				min-height: 8.5rem;
				align-items: flex-end;
				justify-content: center;
				padding: 0 0 0.7rem;
				border: 0;
				background: transparent;
				color: var(--page-foreground);
				cursor: pointer;
			}

			.cord::before {
				position: absolute;
				top: 0;
				left: 50%;
				width: 2px;
				height: 6.3rem;
				background: linear-gradient(var(--magenta), var(--cyan));
				content: "";
				transform: translateX(-50%);
			}

			.cord-handle {
				position: relative;
				display: grid;
				width: 1.15rem;
				height: 1.7rem;
				place-items: center;
				border: 2px solid var(--page-background);
				border-radius: 999px;
				background: var(--magenta);
				box-shadow: 0 0 0 2px var(--cyan), 0 0 18px var(--magenta);
				transition: transform 180ms ease;
			}

			.cord:hover .cord-handle { transform: translateY(5px); }

			.cord-label {
				position: absolute;
				top: 8.1rem;
				left: 50%;
				width: max-content;
				color: var(--page-muted);
				font-size: 0.57rem;
				font-weight: 900;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				transform: translateX(-50%);
			}

			@media (max-width: 520px) {
				main { padding: 4.5rem 1rem 1.25rem; }
				h1 { font-size: clamp(3.45rem, 16vw, 5.5rem); }
				.role { font-size: clamp(0.54rem, 2.35vw, 0.78rem); }
				.links { gap: 1.3rem; }
				.links a { font-size: 0.7rem; letter-spacing: 0.09em; }
				.details { margin-bottom: 1.8rem; font-size: 0.8rem; }
				.cord { right: 1.25rem; min-height: 7.5rem; }
				.cord::before { height: 5.5rem; }
				.cord-label { top: 7.1rem; font-size: 0.5rem; }
			}

			@media (max-height: 560px) {
				main { padding-top: 3.75rem; padding-bottom: 0.75rem; }
				h1 { font-size: clamp(3rem, 16vh, 7rem); }
				.role { margin-top: 0.85rem; }
				.details { margin: 0.55rem 0 1rem; }
				.cord { min-height: 6rem; }
				.cord::before { height: 4rem; }
				.cord-label { top: 5.6rem; }
			}

			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after {
					scroll-behavior: auto !important;
					animation: none !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<button class="cord" id="light-switch" type="button" aria-label="Turn the lights on" aria-pressed="false">
			<span class="cord-handle" aria-hidden="true"></span>
			<span class="cord-label" id="cord-label">Pull for light</span>
		</button>

		<main>
			<section class="identity" aria-labelledby="name">
				<p class="eyebrow">Hello! i am</p>
				<h1 id="name"><span class="name-line" data-text="Mattia">Mattia</span><span class="name-line" data-text="Larentis">Larentis</span></h1>
				<p class="role" data-text="Senior Full Stack Developer + Solution Architect">Senior Full Stack Developer + Solution Architect</p>
				<div class="details">
					<span>Trento, Italy</span>
					<a href="mailto:mattia@larentis.eu">mattia@larentis.eu</a>
				</div>
			<nav class="links" aria-label="Find me online">
				<div class="link-item">
					<span class="link-prefix">Coder @</span>
					<a href="https://github.com/nostalgiaz/" target="_blank" rel="noopener noreferrer">GitHub</a>
				</div>
				<div class="link-item">
					<span class="link-prefix">Connect @</span>
					<a href="https://www.linkedin.com/in/mattialarentis" target="_blank" rel="noopener noreferrer">LinkedIn</a>
				</div>
				<div class="link-item">
					<span class="link-prefix">Reviewer @</span>
					<a href="https://dudexpress.it/writers/tia/" target="_blank" rel="noopener noreferrer">Dudexpress</a>
				</div>
				<div class="link-item">
					<span class="link-prefix">Volunteer @</span>
					<a href="https://ludimus.it/" target="_blank" rel="noopener noreferrer">Ludimus</a>
				</div>
			</nav>
			</section>
		</main>
		<script>
			const lightSwitch = document.getElementById("light-switch")
			const cordLabel = document.getElementById("cord-label")

			lightSwitch.addEventListener("click", () => {
				const lightsOn = document.body.classList.toggle("lights-on")
				lightSwitch.setAttribute("aria-pressed", String(lightsOn))
				lightSwitch.setAttribute("aria-label", lightsOn ? "Turn the lights off" : "Turn the lights on")
				cordLabel.textContent = lightsOn ? "Pull for dark" : "Pull for light"
			})
		</script>
	</body>
</html>
